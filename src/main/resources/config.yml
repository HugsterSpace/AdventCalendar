STORAGE:
  # Available types: SQLITE, MYSQL, MONGODB
  TYPE: "SQLITE"
  SQLITE:
    FILE: "database.db"
  MYSQL:
    HOST: "127.0.0.1"
    PORT: 3306
    DATABASE: "advent_calendar"
    USERNAME: "root"
    PASSWORD: "password"
    POOL_SIZE: 10
    PROPERTIES: "useSSL=false&autoReconnect=true&characterEncoding=utf8"
  MONGODB:
    URI: "mongodb://127.0.0.1:27017"
    DATABASE: "advent_calendar"
    COLLECTION: "players"

SETTINGS:
  TIMEZONE: "America/New_York"
  MONTH: 12
  START_DAY: 1
  TOTAL_DAYS: 28
  ALLOW_PAST_DAYS_CLAIM: false
  JOIN_REMINDER: true
  JOIN_REMINDER_DELAY_TICKS: 40

MESSAGES:
  CLAIMED: "&#6BF18DYou have claimed the reward for &eDay #%day%&a!"
  ALREADY_CLAIMED: "&7You have already claimed &#6BF18DDay #%day%&7."
  LOCKED: "&cDay &e#%day% &cis locked! Unlocks in &e%countdown%&c."
  EXPIRED: "&cDay &e#%day% &chas expired and can no longer be claimed!"
  NOT_ACTIVE_MONTH: "&cThe Advent Calendar is currently not active!"
  JOIN_REMINDER: "&eYou have unclaimed Advent Calendar rewards for &6Day #%day%&e! Use &6/calendar &eto claim!"
  RELOADED: "&#6BF18DAdventCalendar configuration reloaded successfully."
  RESET_PLAYER: "&#6BF18DReset Advent Calendar progress for &e%player%&#6BF18D."
  RESET_ALL: "&#6BF18DReset Advent Calendar progress for &eall players&#6BF18D."
